<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Hors connexion | Kassandre</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #0a0a0f; color: #e8e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .box { max-width: 380px; }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0 0 10px; }
    p { color: #9a9ab0; line-height: 1.5; margin: 0 0 24px; }
    button { background: #7c3aed; color: #fff; border: 0; border-radius: 10px; padding: 12px 26px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="" />
    <h1>Vous êtes hors connexion</h1>
    <p>Kassandre a besoin d'internet pour afficher les marchés en direct. Vérifiez votre connexion, puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
